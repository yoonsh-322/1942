<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1942 Retro Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* 모바일에서 스크롤 방지 */
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 800px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background-color: #0f3851; /* 깊은 바다색 */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .text-shadow {
            text-shadow: 2px 2px 0 #000;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        button {
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="flex justify-between items-start w-full text-white text-xl md:text-2xl font-bold text-shadow">
                <div>SCORE: <span id="score">0</span></div>
                <div>LIVES: <span id="lives">3</span></div>
            </div>
        </div>

        <div id="start-screen">
            <h1 class="text-5xl md:text-6xl text-white font-black mb-4 text-shadow italic text-center">1942<br><span class="text-2xl text-blue-300">WEB STRIKE</span></h1>
            <p class="text-gray-300 mb-8 text-center px-4">Move: Arrow Keys or Drag<br>Shoot: Space or Auto-fire</p>
            <button id="start-btn" class="px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded shadow-lg border-2 border-red-800 transition-colors text-xl">START MISSION</button>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1 class="text-5xl md:text-6xl text-red-500 font-black mb-2 text-shadow text-center">MISSION FAILED</h1>
            <p class="text-white text-2xl mb-8 text-shadow">FINAL SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded shadow-lg border-2 border-blue-800 transition-colors text-xl">RESTART</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI 요소
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // 게임 논리 해상도 (화면 비율에 맞게 렌더링)
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 700;
        
        // 캔버스 크기를 컨테이너에 맞춤
        function resizeCanvas() {
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 게임 상태 변수
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let frameCount = 0;
        let backgroundY = 0;

        // 게임 객체 배열
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let islands = [];

        // 입력 상태
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false
        };
        let isTouching = false;
        let touchPos = { x: 0, y: 0 };
        let lastTouchPos = { x: 0, y: 0 };

        // 키보드 입력
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp') keys.ArrowUp = true;
            if (e.code === 'ArrowDown') keys.ArrowDown = true;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space') keys.Space = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowUp') keys.ArrowUp = false;
            if (e.code === 'ArrowDown') keys.ArrowDown = false;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // 터치 입력 (모바일 대응)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouching = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = GAME_WIDTH / rect.width;
            const scaleY = GAME_HEIGHT / rect.height;
            lastTouchPos.x = (e.touches[0].clientX - rect.left) * scaleX;
            lastTouchPos.y = (e.touches[0].clientY - rect.top) * scaleY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isTouching) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = GAME_WIDTH / rect.width;
            const scaleY = GAME_HEIGHT / rect.height;
            touchPos.x = (e.touches[0].clientX - rect.left) * scaleX;
            touchPos.y = (e.touches[0].clientY - rect.top) * scaleY;
            
            // 드래그한 거리만큼 플레이어 이동
            if (gameState === 'PLAYING' && player && !player.isDead) {
                const dx = touchPos.x - lastTouchPos.x;
                const dy = touchPos.y - lastTouchPos.y;
                player.x += dx;
                player.y += dy;
                // 화면 밖으로 나가지 않게 제한
                player.x = Math.max(player.width/2, Math.min(GAME_WIDTH - player.width/2, player.x));
                player.y = Math.max(player.height/2, Math.min(GAME_HEIGHT - player.height/2, player.y));
            }
            
            lastTouchPos.x = touchPos.x;
            lastTouchPos.y = touchPos.y;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isTouching = false;
        }, { passive: false });

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        // 폭발 파티클 생성 함수
        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        class Player {
            constructor() {
                this.x = GAME_WIDTH / 2;
                this.y = GAME_HEIGHT - 100;
                this.width = 40;
                this.height = 40;
                this.speed = 5;
                this.lives = 3;
                this.shootCooldown = 0;
                this.invulnerableTimer = 0;
                this.isDead = false;
            }

            update() {
                if (this.isDead) return;

                // 키보드 이동
                if (keys.ArrowUp) this.y -= this.speed;
                if (keys.ArrowDown) this.y += this.speed;
                if (keys.ArrowLeft) this.x -= this.speed;
                if (keys.ArrowRight) this.x += this.speed;

                // 화면 경계 제한
                this.x = Math.max(this.width/2, Math.min(GAME_WIDTH - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(GAME_HEIGHT - this.height/2, this.y));

                // 발사 (스페이스바 누르거나 터치 중일 때 자동 발사)
                if (this.shootCooldown > 0) this.shootCooldown--;
                if ((keys.Space || isTouching) && this.shootCooldown === 0) {
                    this.shoot();
                }

                // 무적 시간 감소
                if (this.invulnerableTimer > 0) this.invulnerableTimer--;
            }

            shoot() {
                // 쌍발 기총
                bullets.push(new Bullet(this.x - 12, this.y - 15, -12, 'player'));
                bullets.push(new Bullet(this.x + 12, this.y - 15, -12, 'player'));
                this.shootCooldown = 12; // 연사 속도
            }

            draw() {
                if (this.isDead) return;
                // 무적 깜빡임 효과
                if (this.invulnerableTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                // P-38 라이트닝 스타일 비행기 그리기
                ctx.fillStyle = '#C0C0C0'; // 은색 동체
                
                // 주 날개
                ctx.fillRect(-25, -5, 50, 10);
                // 중앙 조종석 꼬투리
                ctx.fillRect(-5, -20, 10, 30);
                // 엔진 및 쌍발 붐
                ctx.fillStyle = '#A0A0A0';
                ctx.fillRect(-15, -15, 6, 35); // 왼쪽 붐
                ctx.fillRect(9, -15, 6, 35);  // 오른쪽 붐
                // 수평 꼬리날개
                ctx.fillRect(-12, 15, 24, 6);
                
                // 조종석 유리
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(-3, -12, 6, 8);

                ctx.restore();
            }

            hit() {
                if (this.invulnerableTimer > 0 || this.isDead) return;
                
                createExplosion(this.x, this.y, '#FFA500', 30);
                this.lives--;
                livesEl.innerText = this.lives;
                
                if (this.lives <= 0) {
                    this.isDead = true;
                    setTimeout(endGame, 1000); // 1초 후 게임 오버 화면
                } else {
                    this.invulnerableTimer = 120; // 2초 무적 (60fps 기준)
                }
            }
        }

        class Bullet {
            constructor(x, y, speedY, owner) {
                this.x = x;
                this.y = y;
                this.speedY = speedY;
                this.owner = owner;
                this.width = owner === 'player' ? 4 : 6;
                this.height = owner === 'player' ? 15 : 6;
                this.color = owner === 'player' ? '#FFFF00' : '#FF4500';
            }

            update() {
                this.y += this.speedY;
            }

            draw() {
                ctx.fillStyle = this.color;
                if (this.owner === 'player') {
                    ctx.fillRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.width/2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        class Enemy {
            constructor(type) {
                this.x = Math.random() * (GAME_WIDTH - 60) + 30;
                this.y = -30;
                this.type = type;
                this.width = 30;
                this.height = 30;
                this.isDead = false;
                this.frameCount = 0;
                
                // 타입별 설정
                if (type === 1) { // 기본 직진
                    this.hp = 1;
                    this.speedY = 2 + Math.random() * 1.5;
                    this.speedX = 0;
                    this.color = '#556B2F'; // 진녹색
                    this.scoreValue = 100;
                } else if (type === 2) { // 지그재그
                    this.hp = 2;
                    this.speedY = 1.5;
                    this.speedX = 0;
                    this.startX = this.x;
                    this.color = '#8B0000'; // 진홍색
                    this.scoreValue = 200;
                } else if (type === 3) { // 대형 기체
                    this.width = 60;
                    this.height = 40;
                    this.hp = 10;
                    this.speedY = 0.8;
                    this.speedX = 0;
                    this.color = '#2F4F4F';
                    this.scoreValue = 1000;
                }
            }

            update() {
                this.frameCount++;
                this.y += this.speedY;

                if (this.type === 2) {
                    this.x = this.startX + Math.sin(this.frameCount * 0.05) * 50;
                }

                // 가끔 적이 총알을 쏨
                if (this.type !== 1 && this.y > 0 && this.y < GAME_HEIGHT - 200) {
                    if (Math.random() < 0.01) {
                        this.shoot();
                    }
                }
            }

            shoot() {
                enemyBullets.push(new Bullet(this.x, this.y + this.height/2, 4, 'enemy'));
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.type === 3) {
                    // 대형 폭격기
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-30, -10, 60, 20); // 주날개
                    ctx.fillRect(-10, -20, 20, 40); // 동체
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-25, 0, 10, 10); // 엔진
                    ctx.fillRect(15, 0, 10, 10);
                } else {
                    // 소형 전투기 (아래를 향함)
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(0, 15); // 기수
                    ctx.lineTo(-15, -5); // 좌측 날개끝
                    ctx.lineTo(-5, -5);
                    ctx.lineTo(-5, -15); // 꼬리
                    ctx.lineTo(5, -15);
                    ctx.lineTo(5, -5);
                    ctx.lineTo(15, -5); // 우측 날개끝
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
                this.color = color;
                this.size = Math.random() * 3 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        class Island {
            constructor() {
                this.x = Math.random() * GAME_WIDTH;
                this.y = -100;
                this.size = Math.random() * 50 + 30;
                this.speedY = 0.5; // 배경 스크롤 속도와 동일하게
                this.color = '#1b5e20'; // 섬 색상
                
                // 무작위 다각형 섬 생성
                this.points = [];
                const numPoints = 8;
                for (let i = 0; i < numPoints; i++) {
                    const angle = (i / numPoints) * Math.PI * 2;
                    const radius = this.size * (0.6 + Math.random() * 0.4);
                    this.points.push({
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius
                    });
                }
            }
            update() {
                this.y += this.speedY;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i].x, this.points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                
                // 모래사장 효과 약간
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#c2b280';
                ctx.stroke();
                
                ctx.restore();
            }
        }

        let player;
        let animationId;

        function initGame() {
            player = new Player();
            score = 0;
            frameCount = 0;
            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            islands = [];
            
            scoreEl.innerText = score;
            livesEl.innerText = player.lives;
            
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            // 초기 섬 몇 개 배치
            for(let i=0; i<3; i++) {
                let isl = new Island();
                isl.y = Math.random() * GAME_HEIGHT;
                islands.push(isl);
            }
        }

        function spawnEnemies() {
            // 기본 적 주기적 스폰
            if (frameCount % 60 === 0) {
                enemies.push(new Enemy(1));
            }
            
            // 지그재그 적 가끔 스폰
            if (frameCount % 150 === 0) {
                enemies.push(new Enemy(2));
            }

            // 대형 폭격기 보스급 가끔 스폰
            if (frameCount % 600 === 0 && frameCount > 0) {
                enemies.push(new Enemy(3));
            }
        }

        function checkCollisions() {
            // 두 사각형 중심 거리 기반 충돌 (단순화)
            function isCollide(obj1, obj2, padding = 0) {
                const dx = obj1.x - obj2.x;
                const dy = obj1.y - obj2.y;
                const distance = Math.hypot(dx, dy);
                return distance < (obj1.width/2 + obj2.width/2 - padding);
            }

            // 1. 플레이어 총알 -> 적
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (isCollide(b, e)) {
                        e.hp--;
                        hit = true;
                        createExplosion(b.x, b.y, '#FFFF00', 5); // 작은 피격 이펙트
                        
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, '#FF4500', e.type === 3 ? 50 : 20);
                            score += e.scoreValue;
                            scoreEl.innerText = score;
                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }
                if (hit) {
                    bullets.splice(i, 1);
                }
            }

            if (player.isDead) return;

            // 2. 적 총알 -> 플레이어
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                if (isCollide(enemyBullets[i], player, 5)) {
                    enemyBullets.splice(i, 1);
                    player.hit();
                }
            }

            // 3. 적 본체 -> 플레이어 충돌
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (isCollide(enemies[i], player, 10)) {
                    createExplosion(enemies[i].x, enemies[i].y, '#FF4500', 20);
                    enemies.splice(i, 1);
                    player.hit();
                }
            }
        }

        function drawBackground() {
            // 바다 배경
            ctx.fillStyle = '#0f3851';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 스크롤되는 파도 선 그리기
            backgroundY = (backgroundY + 0.5) % 50;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            for (let y = backgroundY - 50; y < GAME_HEIGHT; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            frameCount++;

            // 객체 생성
            spawnEnemies();
            if (frameCount % 400 === 0) islands.push(new Island()); // 섬 스폰

            // 업데이트 로직
            player.update();
            
            islands.forEach(isl => isl.update());
            islands = islands.filter(isl => isl.y < GAME_HEIGHT + 150);

            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => b.y > -20); // 화면 밖 총알 제거

            enemyBullets.forEach(b => b.update());
            enemyBullets = enemyBullets.filter(b => b.y < GAME_HEIGHT + 20);

            enemies.forEach(e => e.update());
            enemies = enemies.filter(e => e.y < GAME_HEIGHT + 50);

            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);

            checkCollisions();
        }

        function draw() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawBackground();
            
            // 그리기 순서: 배경 섬 -> 총알 -> 적 -> 플레이어 -> 파티클
            islands.forEach(isl => isl.draw());
            bullets.forEach(b => b.draw());
            enemyBullets.forEach(b => b.draw());
            enemies.forEach(e => e.draw());
            if(player) player.draw();
            particles.forEach(p => p.draw());
        }

        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            gameOverScreen.classList.remove('hidden');
            finalScoreEl.innerText = score;
        }

        startBtn.addEventListener('click', () => {
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            initGame();
        });

        // 윈도우 로드시 기본 렌더링 루프 시작 (타이틀 화면 배경 효과용)
        window.onload = () => {
            gameLoop();
        };

    </script>
</body>
</html>
